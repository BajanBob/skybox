name: Skybox Recon - Build all platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows x64 (portable ZIP + installer)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Version
        shell: pwsh
        run: |
          $v = python -c "import skybox; print(skybox.VERSION)"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Unit tests and engine self-test
        run: |
          python -m pytest -q tests
          python skybox.py selftest
      - name: Build SkyboxRecon.exe (desktop GUI)
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SkyboxRecon
          --icon assets/icon.ico --add-data "assets/icon.png:assets"
          --hidden-import skybox --hidden-import serial.tools.list_ports skybox_gui.py
      - name: Build skybox-cli.exe (command-line engine)
        run: >
          python -m PyInstaller --noconfirm --onefile --console --name skybox-cli
          --icon assets/icon.ico --hidden-import serial skybox.py
      - name: Test skybox-cli.exe
        shell: pwsh
        run: |
          .\dist\skybox-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "skybox-cli.exe self-test failed" }
      - name: Test engine inside SkyboxRecon.exe
        shell: pwsh
        run: |
          $p = Start-Process .\dist\SkyboxRecon.exe -ArgumentList '--cli','selftest' `
                 -NoNewWindow -PassThru -RedirectStandardOutput cli-out.txt -RedirectStandardError cli-err.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "engine timed out" }
          Get-Content cli-out.txt, cli-err.txt
          if ($p.ExitCode -ne 0) { throw "SkyboxRecon.exe --cli selftest exit code $($p.ExitCode)" }
          if (-not (Select-String -Path cli-out.txt -Pattern '0 failure\(s\)' -Quiet)) { throw "self-test output missing" }
      - name: GUI start-up smoke test
        shell: pwsh
        run: |
          $p = Start-Process .\dist\SkyboxRecon.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "GUI did not close after smoke test" }
          if (Test-Path dist\SkyboxRecon-error.log) { Get-Content dist\SkyboxRecon-error.log }
          if ($p.ExitCode -ne 0) { throw "GUI start-up failed, exit code $($p.ExitCode)" }
      - name: Portable ZIP
        shell: pwsh
        run: |
          $stage = "package\SkyboxRecon-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\SkyboxRecon.exe, dist\skybox-cli.exe $stage
          Copy-Item Launch-SkyboxRecon.bat, Run-SkyboxRecon.bat, Create-Desktop-Shortcut.ps1, README-WINDOWS.txt $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "package\SkyboxRecon-$env:APP_VERSION-Windows-x64-Portable.zip" -Force
      - name: Installer (Inno Setup, desktop + Start-menu shortcuts)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\windows\SkyboxRecon.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem package
      - name: Silent install test
        shell: pwsh
        run: |
          $setup = Get-ChildItem package\*-Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=desktopicon','/DIR=C:\SkyboxTest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path C:\SkyboxTest\SkyboxRecon.exe)) { throw "SkyboxRecon.exe not installed" }
          & C:\SkyboxTest\skybox-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SkyboxRecon-Windows-x64-Portable
          path: package/*-Portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SkyboxRecon-Windows-x64-Setup
          path: package/*-Setup.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux x86_64 (ZIP)
    runs-on: ubuntu-22.04   # older glibc = runs on more distributions
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev xvfb zip
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          echo "APP_VERSION=$(python -c 'import skybox; print(skybox.VERSION)')" >> "$GITHUB_ENV"
      - name: Unit tests and engine self-test
        run: |
          python -m pytest -q tests
          python skybox.py selftest
      - name: Build SkyboxRecon and skybox-cli
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SkyboxRecon \
            --add-data "assets/icon.png:assets" \
            --hidden-import skybox --hidden-import serial.tools.list_ports skybox_gui.py
          python -m PyInstaller --noconfirm --onefile --console --name skybox-cli --hidden-import serial skybox.py
      - name: Test binaries
        run: |
          ./dist/skybox-cli selftest
          ./dist/SkyboxRecon --cli selftest | tee cli-out.txt
          grep -q '0 failure(s)' cli-out.txt
          timeout 120 xvfb-run -a ./dist/SkyboxRecon --smoke-test
      - name: ZIP
        run: |
          stage=package/SkyboxRecon-Linux-x86_64
          mkdir -p "$stage"
          cp dist/SkyboxRecon dist/skybox-cli "$stage/"
          cp packaging/linux/install.sh packaging/linux/skybox-recon.desktop packaging/linux/README-LINUX.txt "$stage/"
          cp assets/icon.png "$stage/skybox-recon.png"
          chmod +x "$stage/SkyboxRecon" "$stage/skybox-cli" "$stage/install.sh"
          (cd package && zip -r -X "SkyboxRecon-$APP_VERSION-Linux-x86_64.zip" SkyboxRecon-Linux-x86_64)
      - uses: actions/upload-artifact@v4
        with:
          name: SkyboxRecon-Linux-x86_64
          path: package/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Android
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - name: Prepare Capacitor Android project
        working-directory: mobile
        run: |
          npm ci
          npm test
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          OUT="$GITHUB_WORKSPACE/SkyboxRecon-$APP_VERSION-Android.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          else
            echo "::notice::No signing secrets set - building a debug-signed APK (fine for sideloading)."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          "$BT/aapt2" dump badging "$OUT" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: SkyboxRecon-Android-APK
          path: SkyboxRecon-*-Android.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ Release
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
