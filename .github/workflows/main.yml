
name: Skybox Recon - Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Download repository source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyinstaller

      - name: Build SkyboxRecon.exe
        shell: pwsh
        run: |
          if (!(Test-Path "skybox.py")) {
            throw "skybox.py was not found in the repository root."
          }

          python -m PyInstaller --noconfirm --clean --onefile --console --name SkyboxRecon skybox.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SkyboxRecon.exe")) {
            throw "Windows executable was not generated."
          }
          Get-Item "dist/SkyboxRecon.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SkyboxRecon-Windows-x64
          path: dist/SkyboxRecon.exe
          if-no-files-found: error
          retention-days: 30
