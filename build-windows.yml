name: Skybox Recon - Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          if (!(Test-Path "skybox.py")) { throw "skybox.py was not found in repository root." }
          python -m PyInstaller --noconfirm --clean --onefile --console --name SkyboxRecon skybox.py

      - name: Run offline self-test
        shell: pwsh
        run: |
          .\dist\SkyboxRecon.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "Skybox Recon self-test failed." }

      - name: Assemble Windows ZIP
        shell: pwsh
        run: |
          $stage = "package\SkyboxRecon-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist\SkyboxRecon.exe" $stage
          Copy-Item "Run-SkyboxRecon.bat" $stage
          Copy-Item "README-WINDOWS.txt" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "package\SkyboxRecon-Windows-x64.zip" -Force
          if (!(Test-Path "package\SkyboxRecon-Windows-x64.zip")) { throw "ZIP package was not created." }

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: SkyboxRecon-Windows-x64
          path: package/SkyboxRecon-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
